<!doctype html>
<!--
  print.html — ЧИСТЫЙ HTML-шаблон печатной страницы (вариант A).

  Загружается в скрытом iframe из Preview.tsx; именно из этого iframe
  вызывается window.print(). В documentElement нет ничего, кроме <div id="root">:
  ни анимированного фона сайта, ни полноэкранных обёрток min-h-screen, ни
  тулбаров, ни скрытых дублей разметки. Поэтому высота печатаемого документа
  равна высоте контента, а значит:
   • контент первой страницы не отъезжает сверху на 1/5 листа;
   • пустые страницы после текстовых не появляются.

  Стили: src/print.css (поля A4, разрывы) + src/index.css (классы резюме),
  скрипт: src/print.tsx (рендер того же ResumeContent, что и предпросмотр).
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULUM-PULUM — печать резюме</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/print.tsx"></script>
  </body>
</html>
