services:
  frontend:
    build: .
    container_name: pulum-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src          # hot-reload исходников
      - ./index.html:/app/index.html
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: pulum-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app           # hot-reload кода бэкенда
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: pulum-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
